name: Build Windows EXE & Release

# Builds a standalone Windows .exe with PyInstaller and publishes it as a
# GitHub Release. The release version comes from the VERSION file (single
# source of truth) -- bump it to cut a new versioned release. A pushed git
# tag (vX.Y.Z) or a manual run input can override it.
on:
  push:
    tags:
      - 'v*'
    branches:
      - 'master'
      - 'claude/upbeat-keller-QDOgP'
    paths:
      - 'auto_clicker.py'
      - 'updater.py'
      - 'requirements.txt'
      - 'VERSION'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Override release tag (e.g. v1.2.0). Leave blank to use the VERSION file.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(tr -d '[:space:]' < VERSION)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: >
          pyinstaller --onefile --windowed --name AutoClicker
          --collect-submodules pynput
          --add-data "VERSION;."
          auto_clicker.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-windows
          path: dist/AutoClicker.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Auto-Clicker ${{ steps.ver.outputs.tag }}
          files: dist/AutoClicker.exe
          make_latest: true
          generate_release_notes: true
          body: |
            ## Auto-Clicker (Windows)

            Standalone Windows executable — no Python install required.

            **Download `AutoClicker.exe` below and run it.**

            ### Features
            - Configurable global toggle hotkey (default `F6`)
            - Adjustable click speed (clicks per second)
            - Selectable mouse button (left / right / middle)

            > Windows SmartScreen may warn about an unrecognized app since the
            > binary is unsigned. Click **More info → Run anyway**.
