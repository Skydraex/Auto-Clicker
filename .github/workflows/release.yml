name: Build Windows EXE & Release

# Builds a standalone Windows .exe with PyInstaller and publishes it as a
# GitHub Release. Triggered by pushing a version tag (e.g. v1.0.0), or run
# manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
    branches:
      - 'master'
    paths:
      - 'auto_clicker.py'
      - 'updater.py'
      - 'requirements.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: >
          pyinstaller --onefile --windowed --name AutoClicker
          --collect-submodules pynput
          auto_clicker.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-windows
          path: dist/AutoClicker.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v1.0.0' }}
          name: Auto-Clicker ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v1.0.0' }}
          files: dist/AutoClicker.exe
          make_latest: true
          generate_release_notes: true
          body: |
            ## Auto-Clicker (Windows)

            Standalone Windows executable — no Python install required.

            **Download `AutoClicker.exe` below and run it.**

            ### Features
            - Configurable global toggle hotkey (default `F6`)
            - Adjustable click speed (clicks per second)
            - Selectable mouse button (left / right / middle)

            > Windows SmartScreen may warn about an unrecognized app since the
            > binary is unsigned. Click **More info → Run anyway**.
